name: Build & Publish BUGTI EDITZ APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bugti-editz-latest-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" >/dev/null || \
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" >/dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            fi
            if [ ! -s debug.keystore ]; then
              keytool -genkeypair -noprompt -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build BUGTI EDITZ APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Verify and prepare APK asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Bugti-Editz.apk
          ls -lh Bugti-Editz.apk

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugti-Editz-APK
          path: Bugti-Editz.apk
          retention-days: 30

      - name: Publish APK to permanent Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="Automated BUGTI EDITZ build from commit ${GITHUB_SHA} (Run #${GITHUB_RUN_NUMBER}). Direct Latest APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Bugti-Editz.apk"

          if gh release view latest >/dev/null 2>&1; then
            if ! gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1; then
              echo "::error::Failed to update 'latest' tag. Ensure Settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'."
              exit 1
            fi
            gh release upload latest Bugti-Editz.apk --clobber
            gh release edit latest \
              --title "BUGTI EDITZ — Latest APK" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            if ! gh release create latest Bugti-Editz.apk \
              --target "${GITHUB_SHA}" \
              --title "BUGTI EDITZ — Latest APK" \
              --notes "$RELEASE_NOTES" \
              --latest; then
              echo "::error::Failed to create GitHub Release. Ensure Settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'."
              exit 1
            fi
          fi

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" >/dev/null || \
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" >/dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2
