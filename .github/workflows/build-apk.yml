name: Build & Publish BUGTI EDITZ APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bugti-editz-latest-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build BUGTI EDITZ APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Prepare APK asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bugti-Editz.apk
          ls -lh Bugti-Editz.apk

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugti-Editz-APK
          path: Bugti-Editz.apk
          retention-days: 30

      - name: Publish APK to permanent Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest

          RELEASE_NOTES="Automated BUGTI EDITZ build from commit ${GITHUB_SHA} (Run #${GITHUB_RUN_NUMBER}). Direct Latest APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Bugti-Editz.apk"

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Bugti-Editz.apk --clobber
            gh release edit latest \
              --title "BUGTI EDITZ — Latest APK" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create latest Bugti-Editz.apk \
              --target "${{ github.sha }}" \
              --title "BUGTI EDITZ — Latest APK" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
